name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Static site: no build step, just publish the site files.
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html style.css app.js icons.js tools.json sw.js manifest.webmanifest \
            icon.svg apple-touch-icon.png pwa-*.png assets _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
